[package]
name = "stocks_tracker"
version = "0.1.0"
edition = "2021"

[features]
default = ["fake", "mockall"]
production = []
fake = ["dep:fake"]

[lib]
name = "stocks_tracker"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/app/api/main.rs"

[[bin]]
name = "cli"
path = "src/app/cli/main.rs"

[[bin]]
name = "refresher"
path = "src/app/refresher/main.rs"

[[bin]]
name = "notifier"
path = "src/app/notifier/main.rs"

[dependencies]
# Web and networking
axum = { version = "0.8.1", features = ["tokio", "http1", "tracing"] }
axum-macros = "0.5.0"
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path", "request-id", "trace"] }
http = "1.3.1"
http-body-util = "0.1.3"
bytes = "1.10.1"

# Async and runtime
tokio = { version = "1.29.1", features = ["full"] }
async-trait = "0.1.88"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37.4", features = ["serialize"] }

# Database
sea-orm = { version = "1.1.8", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
# openssl = { version = "0.10", features = ["vendored"] }

# Utilities
uuid = { version = "1.16", features = ["v4"] }
chrono = "0.4"
regex = "1.11"
rand = "0.9.0"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"

# Error handling
thiserror = "2.0"

# Logging and tracing
log = "0.4.26"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["json"] }

# Telegram
teloxide = { version = "0.15.0", features = ["macros"] }
tma-init-data = "1.2"

# Testing and mocking (required in main code for interfaces)
mockall = { version = "0.13.1", optional = true }
fake = { version = "4.3", features = ["chrono", "derive"], optional = true }
shaku = "0.6.2"
redis = { version = "0.30.0", features = ["tokio-comp"] }
tower-layer = "0.3.3"
aide = { version = "0.14.2", features = ["axum", "axum-extra", "axum-json", "axum-tokio", "redoc", "scalar", "swagger"] }
schemars = { version = "0.8.22", features = ["uuid", "uuid1"] }
