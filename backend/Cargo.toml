[workspace]
resolver = "3"
members = [
    "libs/domain",
    "libs/adapters",
    "libs/http_client_stocks_tracker",
    "libs/test_utils",
    "libs/test_integration",
    "libs/test_e2e",
    # "apps/admin",
    "apps/api",
    "apps/cli",
    "apps/migration",
    "apps/refresher",
    "apps/notifier",
]

package.version = "0.1.2"
package.edition = "2024"

[workspace.dependencies]

migration = { path = "apps/migration" }
adapters = { path = "libs/adapters" }
domain = { path = "libs/domain" }
http_client_stocks_tracker = { path = "libs/http_client_stocks_tracker" }
test_utils = { path = "libs/test_utils" }

# Web and networking
axum = "0.8.1"
axum-macros = "0.5.0"
async-graphql-axum = "7.0"
sea-orm-pro = "0.1.0"
tower-http = "0.6"
http = "1.3.1"
http-body-util = "0.1.3"
bytes = "1.10.1"
tower-layer = "0.3.3"
utoipa = "5.3.1"
utoipa-axum = "0.2.0"
utoipa-swagger-ui = "9"
reqwest = { version = "0.12", default-features = false }
jsonwebtoken = "9.3.1"

# db
sea-orm = "1.1.8"
seaography = "1.1.1"
redis = "0.30.0"
axum-static-s3 = "0.1.2"
aws-config = "1.1.7"
aws-sdk-s3 = "1.108.0"

# Async and runtime
tokio = "1.29.1"
async-trait = "0.1.88"
async-std = "1"
async-dropper = "0.3.1"

# Serialization
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
quick-xml = "0.37.4"
serde_repr = "^0.1"
serde_with = { version = "^3.8", default-features = false }

# Utilities
uuid = "1.16"
chrono = "0.4"
regex = "1.11"
rand = "0.9.0"
clap = "4.5"
dotenvy = "0.15.7"
shaku = "0.6.2"
tera = "1.19.1"
url = "^2.5"
secrecy = "0.10.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and tracing
log = "0.4.26"
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
# tracing-opentelemetry = "0.32.0"
# opentelemetry-otlp = "0.31.0"

# Telegram
telegram-authorizer = "0.3.0"
teloxide = { version = "0.15", default-features = false }

# Testing and mocking
mockall = "0.13.1"
fake = "4.3"
config = "0.15.11"
rstest = "0.26.1"

[patch.crates-io]
sea-orm = { git = 'https://github.com/KatasonovYP/sea-orm.git', branch = 'fix/seaography-mock' }
