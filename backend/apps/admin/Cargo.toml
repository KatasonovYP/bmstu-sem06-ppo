[package]
name = "admin"
version = "0.1.0"
edition = "2024"

[dependencies]
# stocks_tracker libs
domain = { path = "../../libs/domain" }
adapters = { path = "../../libs/adapters" }

# Web and networking
axum = { version = "0.8.1", features = ["tokio", "http1", "tracing"] }
axum-macros = "0.5.0"
async-graphql-axum = { version = "7.0" }
seaography = { version = "1.1", features = [
    "with-decimal",
    "with-chrono",
    "with-uuid",
    "field-snake-case",
] }
sea-orm-pro = { version = "0.1.0" }
tower-http = { version = "0.6", features = [
    "cors",
    "normalize-path",
    "request-id",
    "trace",
    "fs",
] }
http = "1.3.1"
http-body-util = "0.1.3"
bytes = "1.10.1"
tower-layer = "0.3.3"
utoipa = { version = "5.3.1", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# db
tera = "1.19.1"
sea-orm = { version = "1.1.8", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

# Async and runtime
tokio = { version = "1.29.1", features = ["full"] }
async-trait = "0.1.88"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.16", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15.7"
shaku = "0.6.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and tracing
log = "0.4.26"
tracing = { version = "0.1", features = ["attributes"] }

# Telegram
telegram-authorizer = "0.3.0"

# Testing and mocking (required in main code for interfaces)
mockall = { version = "0.13.1", optional = true }
fake = { version = "4.3", features = ["chrono", "derive"], optional = true }
jsonwebtoken = "9.3.1"
