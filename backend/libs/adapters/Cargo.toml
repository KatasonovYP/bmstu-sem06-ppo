[package]
name = "adapters"
version = "0.1.0"
edition = "2024"

[features]
default = ["fake", "mockall"]
production = []
fake = ["dep:fake"]

[dependencies]
# stocks_tracker libs
domain = { path = "../domain" }

# Async and runtime
tokio = { version = "1.29.1", features = ["full"] }
async-trait = "0.1.88"

# Web and networking
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
quick-xml = { version = "0.37.4", features = ["serialize"] }

# Database
sea-orm = { version = "1.1.8", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "mock",
] }
seaography = { version = "1.1.1", features = [
    "with-decimal",
    "with-chrono",
    "with-uuid",
    "field-snake-case",
] }
redis = { version = "0.30.0", features = ["tokio-comp"] }

# Utilities
uuid = { version = "1.16", features = ["v4"] }
chrono = "0.4"
dotenvy = "0.15.7"
shaku = "0.6.2"

# Logging and tracing
log = "0.4.26"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["json"] }
tracing-appender = "0.2.3"

# Telegram
teloxide = { version = "0.15", default-features = false, features = [
    "macros",
    "rustls",
] }

# Testing and mocking (required in main code for interfaces)
mockall = { version = "0.13.1", optional = true }
fake = { version = "4.3", features = ["chrono", "derive"], optional = true }
config = "0.15.11"

[patch.crates-io]
sea-orm = { git = 'https://github.com/KatasonovYP/sea-orm.git', branch = 'fix/seaography-mock' }
