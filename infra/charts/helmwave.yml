project: stocks-tracker
version: 0.42.2

repositories:
  - name: gitlab
    url: https://charts.gitlab.io/
  - name: grafana
    url: https://grafana.github.io/helm-charts

.options: &options
  create_namespace: true
  wait: true
  timeout: 1m
  max_history: 3
  atomic: true

releases:
  - name: gitlab-runner-main
    namespace: gitlab
    <<: *options
    chart:
      name: gitlab/gitlab-runner
      version: 0.82.0
    values: 
      - third-party/gitlab-runner-values.yaml
      - src: third-party/gitlab-runner-secrets.yaml
        renderer: sops

  - name: gitlab-agent
    namespace: gitlab
    <<: *options
    chart:
      name: gitlab/gitlab-agent
      version: 2.20.0
    values:
      - third-party/gitlab-agent-values.yaml
      - src: third-party/gitlab-agent-secrets.yaml
        renderer: sops

  - name: loki-grafana
    namespace: loki
    <<: *options
    chart:
      name: grafana/grafana
      version: 10.1.2
    values:
      - src: third-party/loki-grafana-secrets.yaml
        renderer: sops

  - name: loki-stack
    namespace: loki
    <<: *options
    chart:
      name: grafana/loki-stack
    values:
      - third-party/loki-stack-values.yaml

