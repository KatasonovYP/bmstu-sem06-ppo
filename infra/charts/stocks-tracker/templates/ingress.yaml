apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.meta.name }}-ingress
  namespace: {{ .Values.meta.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    
    # Add this annotation to use cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Optional: Force HTTPS 
    traefik.ingress.kubernetes.io/redirect-entry-point: https
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    - {{ .Values.ingress.admin.host }}
    secretName: {{ .Values.meta.name }}-tls-cert
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - pathType: Prefix
            path: {{ .Values.ingress.path }}
            backend:
              service:
                name: {{ .Values.meta.name }}-api-service
                port:
                  number: 80
    - host: {{ .Values.ingress.admin.host }}
      http:
        paths:
          - pathType: Prefix
            path: {{ .Values.ingress.admin.path }}
            backend:
              service:
                name: {{ .Values.meta.name }}-admin-service
                port:
                  number: 80
