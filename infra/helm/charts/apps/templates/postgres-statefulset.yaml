{{- if .Values.features.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.meta.name }}-postgres
  namespace: {{ .Values.meta.namespace }}
spec:
  serviceName: {{ .Values.meta.name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.meta.name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Values.meta.name }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - containerPort: {{ .Values.postgres.port }}
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "stocks_tracker"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.meta.name }}-env
                  key: APP_POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: {{ .Values.postgres.resources.limits.cpu }}
              memory: {{ .Values.postgres.resources.limits.memory }}
            requests:
              cpu: {{ .Values.postgres.resources.requests.cpu }}
              memory: {{ .Values.postgres.resources.requests.memory }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}


