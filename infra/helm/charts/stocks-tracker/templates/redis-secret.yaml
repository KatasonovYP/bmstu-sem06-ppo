{{- if .Values.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.meta.name }}-redis-secret
  namespace: {{ .Values.meta.namespace }}
  annotations:
    helmwave.app/skip-diff: "true"
type: Opaque
data:
  redis-password: {{ .Values.redis.password | b64enc | quote }}
{{- end }}
