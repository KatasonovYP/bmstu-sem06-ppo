project: stocks-tracker-production
version: 0.42.2

.options: &options
  create_namespace: true
  wait: true
  timeout: 1m
  max_history: 3
  atomic: true
  context: the-qsb/stocks-tracker:main

releases:

  - name: patroni-production
    namespace: patroni
    <<: *options
    chart: ./infra/helm/charts/patroni
    values:
      - ./infra/helm/values/stocks-tracker-production-values.yaml
      - src: ./infra/helm/values/stocks-tracker-production-secrets.yaml
        renderer: sops
      - ./infra/helm/values/patroni-production-values.yaml

  - name: stocks-tracker-production-env
    namespace: stocks-tracker
    <<: *options
    chart: ./infra/helm/charts/stocks-tracker-env
    values:
      - ./infra/helm/values/stocks-tracker-production-values.yaml
      - src: ./infra/helm/values/stocks-tracker-production-secrets.yaml
        renderer: sops

  - name: stocks-tracker-production-migration
    namespace: stocks-tracker
    <<: *options
    chart: ./infra/helm/charts/stocks-tracker-migration
    depends_on:
      - stocks-tracker-production-env@stocks-tracker
      - patroni-production@patroni
    values:
      - ./infra/helm/values/stocks-tracker-production-values.yaml
      - src: ./infra/helm/values/stocks-tracker-production-secrets.yaml
        renderer: sops

  - name: stocks-tracker-production-app
    namespace: stocks-tracker
    <<: *options
    chart: ./infra/helm/charts/stocks-tracker-app
    depends_on:
      - stocks-tracker-production-migration@stocks-tracker
    values:
      - ./infra/helm/values/stocks-tracker-production-values.yaml
      - src: ./infra/helm/values/stocks-tracker-production-secrets.yaml
        renderer: sops
