project: stocks-tracker-infra
version: 0.42.2

repositories:
  - name: gitlab
    url: https://charts.gitlab.io/
  - name: grafana
    url: https://grafana.github.io/helm-charts

.options: &options
  create_namespace: true
  wait: true
  timeout: 1m
  max_history: 3
  atomic: true
  context: the-qsb/stocks-tracker:main

releases:

  - name: gitlab-agent
    namespace: gitlab
    <<: *options
    chart:
      name: gitlab/gitlab-agent
      version: 2.20.0
    values:
      - infra/helm/values/gitlab-agent-values.yaml
      - src: infra/helm/values/gitlab-agent-secrets.yaml
        renderer: sops

  - name: gitlab-runner-main
    namespace: gitlab
    <<: *options
    chart:
      name: gitlab/gitlab-runner
      version: 0.82.0
    values: 
      - infra/helm/values/gitlab-runner-values.yaml
      - src: infra/helm/values/gitlab-runner-secrets.yaml
        renderer: sops

  - name: loki-grafana
    namespace: loki
    <<: *options
    chart:
      name: grafana/grafana
      version: 10.1.2
    values:
      - src: infra/helm/values/loki-grafana-secrets.yaml
        renderer: sops

  - name: loki-stack
    namespace: loki
    <<: *options
    chart:
      name: grafana/loki-stack
    values:
      - infra/helm/values/loki-stack-values.yaml

  - name: infra
    namespace: infra
    <<: *options
    chart: ./infra/helm/charts/infra
