project: stocks-tracker-infra
version: 0.42.2

repositories:
  - name: gitlab
    url: https://charts.gitlab.io/
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  - name: kubernetes-dashboard
    url: https://kubernetes.github.io/dashboard/
  - name: influxdata
    url: https://helm.influxdata.com/

.options: &options
  create_namespace: true
  wait: true
  timeout: 1m
  max_history: 3
  atomic: true
  context: the-qsb/stocks-tracker:main

releases:

  - name: gitlab-agent
    namespace: gitlab
    <<: *options
    chart:
      name: gitlab/gitlab-agent
      version: 2.20.0
    values:
      - infra/helm/values/gitlab-agent-values.yaml
      - src: infra/helm/values/gitlab-agent-secrets.yaml
        renderer: sops

  - name: gitlab-runner-main
    namespace: gitlab
    <<: *options
    chart:
      name: gitlab/gitlab-runner
      version: 0.82.0
    values: 
      - infra/helm/values/gitlab-runner-values.yaml
      - src: infra/helm/values/gitlab-runner-secrets.yaml
        renderer: sops

  - name: prometheus-stack
    namespace: prometeus
    <<: *options
    chart:
      name: prometheus-community/kube-prometheus-stack
    values:
      - infra/helm/values/prometeus-values.yaml
      - src: infra/helm/values/prometeus-secrets.yaml
        renderer: sops

  - name: loki-stack
    namespace: loki
    <<: *options
    chart:
      name: grafana/loki-stack
    values:
      - infra/helm/values/loki-stack-values.yaml

  - name: influxdb
    namespace: influxdb
    <<: *options
    chart:
      name: influxdata/influxdb
    # values:
    #   - infra/helm/values/influxdb-values.yaml


