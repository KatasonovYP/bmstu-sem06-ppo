meta:
  name: stocks-tracker-testing

image:
  tag: '{{ env "CI_COMMIT_SHORT_SHA" }}'

ingress:
  api:
    host: api.tst.stocks-tracker.ru
  admin:
    host: admin.tst.stocks-tracker.ru

env:
    APP_POSTGRES_USER: postgres
    APP_POSTGRES_HOST: patroni-testing.patroni.svc
    APP_POSTGRES_PORT: '5432'
    APP_POSTGRES_DATABASE: postgres
    APP_MONGO_USER: ""
    APP_MONGO_PASSWORD: ""
    APP_MONGO_HOST: stocks-tracker-testing-mongodb-service
    APP_MONGO_PORT: "27017"
    APP_MONGO_DATABASE: stocks_tracker
    APP_USE_MONGO: "false"
