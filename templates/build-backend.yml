spec:
  inputs:
    stage:
      default: build
      description: 'Defines the build stage'
    rust_version:
      default: latest
      description: 'Specify the Rust version, use values from https://hub.docker.com/_/rust/tags Defaults to latest'
---


.job-build-backend: &job-build-backend
  image: ${REGISTRY}/backend-builder:latest
  variables:
    RUSTC_WRAPPER: sccache
    SCCACHE_BUCKET: stocks-tracker-cache
    SCCACHE_REGION: ru-central1
    SCCACHE_ENDPOINT: storage.yandexcloud.net
    SCCACHE_S3_KEY_PREFIX: cache/sccache
    # SCCACHE_DIR: ${CI_PROJECT_DIR}/sccache
    # SCCACHE_CACHE_SIZE: 5G
  dependencies: []
  cache:
    - key: sccache-local
      policy: pull-push
      paths:
        - ${SCCACHE_DIR}
  # before_script:
  #   sccache --zero-stats || true
  #   sccache --start-server
  # after_script:
  #   - sccache --show-stats || true

job-build-backend:
  stage: $[[ inputs.stage ]]
  image: rust:$[[ inputs.rust_version ]]
  script:
    - cargo build --verbose



job-build-backend:
  <<: *job-build-backend
  stage: build
  needs:
    - job: job-build-push-ci-images
      optional: true
  cache:
    - key: sccache-local
      policy: pull-push
      paths:
        - ${SCCACHE_DIR}
    - key: backend-bin
      policy: push
      paths:
        - backend/bin
    - key: backend-tests
      policy: push
      paths:
        - backend/tests
        - backend/allure-results
  artifacts:
    when: always
    paths:
      - ./backend/cargo-timings

  run:
    - name: sccache-start
      script: sccache --start-server
    - name: build-apps
      script: bash -x ./infra/ci/scripts/job-build-backend-apps.sh
    - name: build tests
      script: bash -x ./infra/ci/scripts/job-build-backend-tests.sh
    - name: sccache-statistics
      script: sccache --show-stats || true

